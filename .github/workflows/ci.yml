name: Scientific checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run marimo check --strict app.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv run python scripts/check_ui.py
