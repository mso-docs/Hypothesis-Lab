[project]
name = "hypothesis-lab"
version = "0.1.0"
description = "A transparent scientific research workspace"
requires-python = ">=3.12"
dependencies = ["marimo>=0.19,<1", "pydantic>=2,<3", "httpx>=0.28,<1", "numpy>=2,<3", "scipy>=1.15,<2", "anywidget>=0.9,<1"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.marimo.display]
theme = "dark"
